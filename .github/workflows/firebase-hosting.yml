name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Un secret absent donne « Failed to authenticate, have you run firebase
      # login? », message qui envoie chercher une session locale alors que la
      # cause est ailleurs. Quatre déploiements ont échoué ainsi sans que rien
      # ne le dise.
      # L'issue est publiée en sortie d'étape : le contexte `secrets` n'est pas
      # utilisable dans un `if:` d'étape, contrairement à `steps`.
      - name: Vérifier la présence d'un identifiant
        id: creds
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo "mode=service_account" >> "$GITHUB_OUTPUT"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Aucun identifiant de déploiement"
            echo "Définir l'un des deux dans Settings > Secrets and variables > Actions :"
            echo
            echo "  FIREBASE_SERVICE_ACCOUNT — recommandé, s'obtient sans terminal."
            echo "    Console Firebase > Paramètres du projet > Comptes de service"
            echo "    > Générer une nouvelle clé privée. Coller le contenu entier"
            echo "    du fichier JSON téléchargé."
            echo
            echo "  FIREBASE_TOKEN — la valeur produite par : firebase login:ci"
            echo "    Méthode dépréciée par Google."
            exit 1
          fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Le CLI lit la clé depuis le fichier que désigne
      # GOOGLE_APPLICATION_CREDENTIALS. umask 077 pour que le fichier ne soit
      # lisible que par le job.
      - name: Écrire la clé de compte de service
        if: steps.creds.outputs.mode == 'service_account'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      # Le compte de service prime : quand GOOGLE_APPLICATION_CREDENTIALS est
      # renseigné, le CLI s'en sert et --token devient superflu.
      - name: Deploy to Firebase Hosting
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo "Authentification par compte de service."
            firebase deploy --only hosting --project flashcard-1d3b9 --non-interactive
          else
            echo "Authentification par jeton (méthode dépréciée par Google)."
            firebase deploy --only hosting --project flashcard-1d3b9 --token "$FIREBASE_TOKEN" --non-interactive
          fi

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
