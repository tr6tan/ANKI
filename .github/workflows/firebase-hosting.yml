name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Un secret absent donne « Failed to authenticate, have you run firebase
      # login? », message qui envoie chercher une session locale alors que la
      # cause est ailleurs. Quatre déploiements ont échoué ainsi sans que rien
      # ne le dise.
      - name: Vérifier la présence du secret
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Secret manquant : FIREBASE_TOKEN"
            echo "À définir dans Settings > Secrets and variables > Actions,"
            echo "avec la valeur produite par : firebase login:ci"
            exit 1
          fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project flashcard-1d3b9 --token "$FIREBASE_TOKEN" --non-interactive
